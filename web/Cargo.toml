[package]
name = "optima_web"
version = "0.1.0"
edition = "2024"

[dependencies]
api_models = { path = "../crates/api_models" }
futures-util = "0.3"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
leptos = { version = "0.8.20", features = ["csr"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "KeyboardEvent", "Location", "Window"] }
