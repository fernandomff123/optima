[package]
name = "optima_web"
version = "0.1.0"
edition = "2024"

[dependencies]
api_models = { path = "../crates/api_models" }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
send_wrapper = "0.6"
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlElement", "KeyboardEvent", "Location", "VisibilityState", "Window"] }
