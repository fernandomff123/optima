[package]
name = "hexagonal_backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/api_models"]
exclude = ["crates/exchange-calendars-rs"]
resolver = "2"


[dependencies]
api_models = { path = "crates/api_models" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dotenvy = "0.15"
duckdb = { version = "1.10505.0", features = ["bundled", "chrono"] }
futures-util = "0.3"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
exchange-calendars-rs = { path = "crates/exchange-calendars-rs" }
quick-xml = { version = "0.31", features = ["serialize"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
rust_decimal = { version = "1.37", features = ["serde"] }
rmp-serde = "1.3"
sha2 = "0.10"

[dev-dependencies]
tower = "0.5"
